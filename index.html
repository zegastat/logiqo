<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Logiqo · Bimbel Online UTBK & CPNS</title>
<meta name="description" content="Bimbel online Logiqo: tryout UTBK SNBT dan SKD CPNS dengan pembahasan, materi, latihan soal, dan kelas online.">
<meta name="theme-color" content="#000000">
<!-- Pratinjau saat link dibagikan di WhatsApp / media sosial -->
<meta property="og:title" content="Logiqo · Bimbel Online UTBK & CPNS">
<meta property="og:description" content="Tryout UTBK SNBT & SKD CPNS dengan pembahasan, materi, latihan soal, dan kelas online setiap malam.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23000'/%3E%3Cpath d='M10 8v15h9' stroke='%23fff' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='22.5' cy='11.5' r='3.5' fill='%23F2C14E'/%3E%3C/svg%3E">
<style>
  /* Halaman ini hanya "bingkai": aplikasi Logiqo (Google Apps Script) ditampilkan penuh di dalamnya.
     Karena dibuka di dalam bingkai situs lain, Google tidak menampilkan banner
     "This application was created by a Google Apps Script user". */
  html, body { margin: 0; height: 100%; background: #F5F5F6; overflow: hidden; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #F5F5F6; }
  #muat { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
          background: #F5F5F6; color: #000; font: 600 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; transition: opacity .3s; z-index: 1; }
  #muat.selesai { opacity: 0; pointer-events: none; }
  .merek { display: flex; align-items: center; gap: 10px; font-size: 26px; font-weight: 700; letter-spacing: -.02em; }
  .merek b { color: #8A6500; }
  .putar { width: 28px; height: 28px; border: 3px solid #E4E4E7; border-top-color: #8A6500; border-radius: 50%; animation: putar .8s linear infinite; }
  .lambat { font-weight: 400; color: #52525B; font-size: 13.5px; text-align: center; max-width: 300px; display: none; padding: 0 16px; }
  .lambat a { color: #8A6500; }
  @keyframes putar { to { transform: rotate(360deg); } }
  @media (prefers-color-scheme: dark) {
    html, body, #app, #muat { background: #000; }
    #muat { color: #fff; }
    .merek b, .lambat a { color: #F2C14E; }
    .putar { border-color: #27272A; border-top-color: #F2C14E; }
    .lambat { color: #A1A1AA; }
  }
  @media (prefers-reduced-motion: reduce) { .putar { animation-duration: 2.4s; } }
  /* Jendela "Masuk dengan Google" (tombol resmi Google harus berada di halaman ini, bukan di dalam aplikasi Apps Script) */
  #glayar { position: fixed; inset: 0; z-index: 5; display: none; align-items: center; justify-content: center; padding: 16px;
            background: rgba(0,0,0,.55); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #glayar.buka { display: flex; }
  .gkotak { width: 100%; max-width: 360px; background: #fff; color: #111; border-radius: 16px; padding: 22px 20px 16px;
            display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,.3); }
  .gkotak h2 { margin: 0; font-size: 18px; }
  .gkotak p { margin: 0; color: #52525B; font-size: 13.5px; }
  #gtombol { min-height: 44px; display: flex; justify-content: center; }
  #gbatal { font: inherit; font-weight: 600; background: none; border: 0; color: #52525B; padding: 8px 14px; cursor: pointer; border-radius: 8px; }
  #gbatal:hover { background: #F4F4F5; }
  @media (prefers-color-scheme: dark) {
    .gkotak { background: #18181B; color: #fff; } .gkotak p, #gbatal { color: #A1A1AA; } #gbatal:hover { background: #27272A; }
  }
</style>
</head>
<body>
<div id="muat" role="status" aria-live="polite">
  <div class="merek">
    <svg width="38" height="38" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#000"/><path d="M10 8v15h9" stroke="#fff" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="22.5" cy="11.5" r="3.5" fill="#F2C14E"/></svg>
    <span>Logi<b>qo</b></span>
  </div>
  <div class="putar" aria-hidden="true"></div>
  <p class="lambat" id="lambat">Memuat Logiqo agak lama. Periksa koneksi internet, atau <a id="langsung" href="#" target="_top">buka langsung</a>.</p>
</div>
<iframe id="app" title="Logiqo" allow="clipboard-write; fullscreen; web-share"></iframe>
<div id="glayar" role="dialog" aria-modal="true" aria-labelledby="gjudul">
  <div class="gkotak">
    <h2 id="gjudul">Masuk dengan Google</h2>
    <p id="gket">Pilih akun Google kamu. Logiqo hanya menerima nama dan alamat email.</p>
    <div id="gtombol"></div>
    <button id="gbatal" type="button">Batal</button>
  </div>
</div>
<noscript><p style="padding:24px;font-family:sans-serif">Aktifkan JavaScript untuk membuka Logiqo.</p></noscript>
<script>
  // ======== SATU-SATUNYA YANG PERLU DIGANTI ========
  // URL aplikasi web dari Apps Script: Terapkan → Kelola deployment → salin "URL aplikasi web" (berakhiran /exec).
  var URL_APLIKASI = 'https://script.google.com/macros/s/AKfycbyZ6nGSqK18l2QOARg0q1vUJbaWi902y8b5IKYc5RZDgehsUCYbEF1mi10ve2NT9yvWYg/exec';
  // ==================================================

  // Panel admin: buka alamat website ini dengan ?admin atau #admin (mis. https://nama.github.io/logiqo/?admin).
  var admin = /(^|[?&])admin(=|&|$)/.test(location.search.slice(1)) || location.hash === '#admin';
  var src = URL_APLIKASI + (admin ? '?admin' : '');
  var frame = document.getElementById('app'), muat = document.getElementById('muat');
  document.getElementById('langsung').href = src;
  frame.addEventListener('load', function () { muat.classList.add('selesai'); });
  // Apps Script biasanya butuh 1–3 detik; bila lebih dari 12 detik, tampilkan bantuan.
  setTimeout(function () { if (!muat.classList.contains('selesai')) document.getElementById('lambat').style.display = 'block'; }, 12000);
  frame.src = src;

  /* ===== Masuk dengan Google =====
     Aplikasi (di dalam bingkai, alamat *.googleusercontent.com) menyapa halaman ini ("halo"). Halaman ini menjawab "siap",
     sehingga tombol Google baru muncul bila aplikasi dibuka lewat website ini. Saat tombol ditekan, aplikasi mengirim Client ID;
     halaman ini menampilkan tombol resmi Google, lalu mengirim kredensial (ID token) kembali ke aplikasi.
     Server Logiqo memeriksa kredensial itu ke Google, jadi halaman ini tidak menyimpan apa pun. */
  var glayar = document.getElementById('glayar'), gtombol = document.getElementById('gtombol'), gket = document.getElementById('gket');
  var gSumber = null, gAsal = '', gsiMuat = null;
  function dariAplikasi(e) { return /^https:\/\/[\w-]+(\.[\w-]+)*\.googleusercontent\.com$/.test(e.origin) || e.origin === 'https://script.google.com'; }
  function kirim(pesan) { if (gSumber) gSumber.postMessage(pesan, gAsal); }
  function tutupGoogle(batal) { glayar.classList.remove('buka'); gtombol.innerHTML = ''; if (batal) kirim({ logiqo: 'googleBatal' }); }
  function muatGsi() {
    if (window.google && google.accounts && google.accounts.id) return Promise.resolve();
    if (!gsiMuat) gsiMuat = new Promise(function (ok, gagal) {
      var s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
      s.onload = ok; s.onerror = function () { gsiMuat = null; gagal(); }; document.head.appendChild(s);
    });
    return gsiMuat;
  }
  function bukaGoogle(clientId, daftar) {
    glayar.classList.add('buka'); gtombol.innerHTML = '<span class="putar"></span>';
    document.getElementById('gjudul').textContent = daftar ? 'Daftar dengan Google' : 'Masuk dengan Google';
    gket.textContent = 'Pilih akun Google kamu. Logiqo hanya menerima nama dan alamat email.';
    muatGsi().then(function () {
      google.accounts.id.initialize({ client_id: clientId, ux_mode: 'popup', auto_select: false,
        callback: function (r) { tutupGoogle(false); kirim({ logiqo: 'googleKred', kredensial: r.credential }); } });
      gtombol.innerHTML = '';
      google.accounts.id.renderButton(gtombol, { type: 'standard', theme: 'outline', size: 'large', shape: 'pill',
        text: daftar ? 'signup_with' : 'signin_with', locale: 'id', width: 280 });
    }, function () {
      gtombol.innerHTML = ''; gket.textContent = 'Layanan Google gagal dimuat. Periksa koneksi internet, lalu tutup dan ulangi.';
    });
  }
  document.getElementById('gbatal').addEventListener('click', function () { tutupGoogle(true); });
  glayar.addEventListener('click', function (e) { if (e.target === glayar) tutupGoogle(true); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && glayar.classList.contains('buka')) tutupGoogle(true); });
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || typeof d !== 'object' || !dariAplikasi(e)) return;
    if (d.logiqo === 'halo') { gSumber = e.source; gAsal = e.origin; kirim({ logiqo: 'siap' }); }
    else if (d.logiqo === 'google' && e.source === gSumber && /^[\w-]+\.apps\.googleusercontent\.com$/.test(String(d.clientId || ''))) {
      bukaGoogle(String(d.clientId), !!d.daftar);
    }
  });
</script>
</body>
</html>
